id: https://example.org/bookstore
name: bookstore
title: Bookstore schema
description: Schema for a fictional bookstore, including entities and their relationships.
default_prefix: bookstore
default_range: string
prefixes:
  bookstore: https://example.org/bookstore/
  linkml: https://w3id.org/linkml/
imports:
  - linkml:types

classes:
  Model:
    description: The base model for this project.
    slots:
      - id
      - created_at

  Person:
    is_a: Model
    description: The base class of a human being.
    slots:
      - name
      - gender
      - date_of_birth

  Book:
    is_a: Model
    description: A book sold by the bookstore.
    annotations:
      api_resource_name: books
    slots:
      - title
      - ISBN
      - author
      - genre
    unique_keys:
      title:
        unique_key_slots:
          - title
      isbn:
        unique_key_slots:
          - ISBN

  Author:
    is_a: Person
    description: A human who has authored books sold by the bookstore.
    annotations:
      api_resource_name: authors
    slots:
      - books_published

  User:
    is_a: Person
    description: A customer of the bookstore.
    annotations:
      api_resource_name: users
    slots:
      - email
      - has_bought
    unique_keys:
      email:
        unique_key_slots:
          - email

slots:
  id:
    description: A UUID identifying the entity.
    range: string
    required: true
    annotations:
      write_model: false
      read_model: true

  created_at:
    description: An ISO-formatted UTC datetime of when the entity was created in the system. This is an infrastructure slot recorded in the database.
    range: datetime
    required: true
    annotations:
      write_model: false
      read_model: true

  name:
    range: string
    required: true
    annotations:
      write_model: true
      read_model: true

  gender:
    range: string
    required: false
    annotations:
      write_model: true
      read_model: true

  date_of_birth:
    description: An ISO-formatted date of when this human was born.
    range: date
    required: false
    annotations:
      write_model: true
      read_model: true

  title:
    description: The title of the book
    range: string
    required: true
    annotations:
      write_model: true
      read_model: true

  ISBN:
    description: The 13 digit ISBN of the book
    range: string
    pattern: ^[0-9]{13}$
    required: true
    annotations:
      write_model: true
      read_model: true

  author:
    description: The author of this book.
    range: Author
    required: true
    inlined: false
    annotations:
      write_model: true
      read_model: true

  genre:
    description: The genre of the book.
    range: Genre
    required: true
    annotations:
      write_model: true
      read_model: true

  books_published:
    description: A collection of books which this author has written.
    range: Book
    multivalued: true
    minimum_cardinality: 0
    required: false
    annotations:
      write_model: false
      read_model: true

  has_bought:
    description: A collection of books which this user has bought.
    range: Book
    multivalued: true
    minimum_cardinality: 0
    required: false
    inlined: false
    annotations:
      write_model: false
      read_model: true
    
  email:
    description: The email of a registered user
    range: string
    annotations:
      write_model: true
      read_model: true

enums:
  Genre:
    permissible_values:
      Sci-fi:
        text: Sci-fi
      Fantasy:
        text: Fantasy
      Crime:
        text: Crime
      Thriller:
        text: Thriller
      Non-fiction:
        text: Non-fiction
      Biography:
        text: Biography
