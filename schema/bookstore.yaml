id: https://example.org/bookstore
name: bookstore
title: Bookstore schema
description: Schema for a fictional bookstore, including entities and their relationships.

prefixes:
  bookstore: https://example.org/bookstore/
  linkml: https://w3id.org/linkml/

default_prefix: bookstore
default_range: string

imports:
  - linkml:types

classes:

  Model:
    description: The base model for any addressable entity in the bookstore.
    slots:
      - id
      - created_at

  Person:
    is_a: Model
    description: The base class of a human being.
    slots:
      - name
      - gender
      - date_of_birth

  Book:
    is_a: Model
    description: A book sold by the bookstore.
    slots:
      - title
      - ISBN
      - authors
      - publisher
      - genre
      - reviews
    unique_keys:
      unique_title:
        unique_key_slots:
          - title
      unique_isbn:
        unique_key_slots:
          - ISBN
    annotations:
      api_resource_name: books

  Author:
    is_a: Person
    description: A human who has authored books sold by the bookstore.
    slots:
      - books_published
    annotations:
      api_resource_name: authors

  Publisher:
    is_a: Model
    description: An organization who publishes books sold by the bookstore.
    slots:
      - name
    annotations:
      api_resource_name: publishers

  User:
    is_a: Person
    description: A customer of the bookstore.
    slots:
      - has_bought
      - reviews
    annotations:
      api_resource_name: users

  Review:
    is_a: Model
    description: A user-submitted review of a book in the store.
    slots:
      - user
      - score
      - review_text
    annotations:
      api_resource_name: reviews


slots:

  id:
    description: A UUID generated by the service.
    identifier: true
    range: string
    required: true
    annotations:
      infrastructure: true
      write_model: false
      read_model: true

  created_at:
    description: ISO-formatted UTC datetime when the entity was created in the system.
    range: datetime
    annotations:
      infrastructure: true
      write_model: false
      read_model: false

  name:
    description: Name of the person or publisher.
    range: string
    required: true
    annotations:
      write_model: true
      read_model: true

  gender:
    description: Gender of the person.
    range: string
    annotations:
      write_model: true
      read_model: true

  date_of_birth:
    description: ISO-formatted date of when the human was born.
    range: date
    annotations:
      write_model: true
      read_model: true

  title:
    description: Title of the book.
    range: string
    required: true
    annotations:
      write_model: true
      read_model: true

  ISBN:
    description: ISBN containing exactly 13 digits.
    range: string
    pattern: '^[0-9]{13}$'
    required: true
    annotations:
      write_model: true
      read_model: true

  authors:
    description: Authors of the book.
    range: Author
    multivalued: true
    minimum_cardinality: 1
    annotations:
      write_model: false
      read_model: false

  publisher:
    description: Publisher of the book.
    range: Publisher
    annotations:
      write_model: false
      read_model: false

  genre:
    description: Genre of the book.
    range: Genre
    required: true
    annotations:
      write_model: true
      read_model: true

  reviews:
    description: Reviews which have been submitted for this book.
    range: Review
    multivalued: true
    minimum_cardinality: 0
    annotations:
      write_model: false
      read_model: false

  books_published:
    description: Books which this author has written.
    range: Book
    multivalued: true
    minimum_cardinality: 0
    annotations:
      write_model: false
      read_model: false

  has_bought:
    description: Books which this user has bought.
    range: Book
    multivalued: true
    minimum_cardinality: 0
    annotations:
      write_model: false
      read_model: false

  user:
    description: The user who authored the review.
    range: User
    required: true
    annotations:
      write_model: true
      read_model: false

  score:
    description: Rating between 0 and 5 stars.
    range: integer
    minimum_value: 0
    maximum_value: 5
    required: true
    annotations:
      write_model: true
      read_model: true

  review_text:
    description: Optional free-text field containing the user's review of the book.
    range: string
    required: false
    annotations:
      write_model: true
      read_model: true


enums:

  Genre:
    description: The genre of a book.
    permissible_values:
      Sci-fi:
      Fantasy:
      Crime:
      Thriller:
      Non-fiction:
      Biography:
